global:
  arguments:
    aws_default_region: us-west-2

labels:
  general:
    environment: dev
    purpose: ssm-ec2-exec-eventbridge-longbuild
  infrastructure:
    cloud: aws
    product: vpc
    area: network

# Explicit named selector definitions (rds/config0.yaml grammar). bucket_vars
# matches the dedicated Lambda-artifacts bucket recorded by the aws_s3_bucket
# stack (resource_type cloud_storage). The purpose label is distinct from the
# plain ssm-ec2-exec-eventbridge scenario so the selector's singular
# must_be_one cardinality cannot pick up that scenario's bucket record.
selectors:
  bucket_vars:
    match:
      filter:
        resource_type: cloud_storage
      labels:
        environment: dev
        purpose: ssm-ec2-exec-eventbridge-longbuild
  keypair_vars:
    match:
      filter:
        resource_type: ssh_key_pair
      labels:
        environment: dev
        purpose: ssm-ec2-exec-eventbridge-longbuild
  network_vars:
    match:
      filter:
        resource_type: vpc
      labels:
        environment: dev
        purpose: ssm-ec2-exec-eventbridge-longbuild
        area: network
        region: us-west-2
        cloud: aws
  sg_vars:
    match:
      filter:
        resource_type: security_group
      labels:
        environment: dev
        purpose: ssm-ec2-exec-eventbridge-longbuild
        area: network
        cloud: aws
  install_vars:
    match:
      filter:
        resource_type: ssm_ec2_exec_eventbridge_install
      labels:
        environment: dev
        purpose: ssm-ec2-exec-eventbridge-longbuild

stacks:
  # Order 0: generate and record the story-owned EC2 key pair.
  story_key_pair:
    stack: config0-hub:::aws::ec2_keypair
    labels:
      - general
      - infrastructure
    arguments:
      key_name: item11-e2e

  # Order 1: create the story-owned VPC, subnets, and security groups. The
  # dependency makes the key-pair-to-VPC story chain explicit.
  story_vpc:
    stack: config0-hub:::aws_networking::aws_vpc_simple
    labels:
      - general
      - infrastructure
    dependencies:
      - story_key_pair
    arguments:
      vpc_name: item11-ssm-runner-vpc
      cloud_tags_hash:
        environment: dev
        purpose: ssm-ec2-exec-eventbridge-longbuild
    spec:
      serialization:
        to_base64:
          arguments:
            - cloud_tags_hash

  # Order 2: create + record the dedicated Lambda-artifacts bucket. cloud_tags_hash
  # carries the labels that bucket_vars matches on.
  lambda_bucket:
    stack: config0-hub:::aws_storage::aws_s3_bucket
    labels:
      - general
      - infrastructure
    arguments:
      bucket: ssm-ec2-exec-eventbridge-longbuild-570017720022
      force_destroy: true
      cloud_tags_hash:
        environment: dev
        purpose: ssm-ec2-exec-eventbridge-longbuild
    # cloud_tags_hash is a `_hash`-convention arg: the aws_s3_bucket stack passes
    # it straight to the tf_executor substack, which base64-decodes it. It MUST
    # arrive base64-encoded, so declare it under spec.serialization.to_base64.
    spec:
      serialization:
        to_base64:
          arguments:
            - cloud_tags_hash

  # Order 3: build the Lambda zips (CodeBuild) then create the infra (terraform).
  # dependencies:[lambda_bucket] holds this until the bucket record is written
  # back, so the selector resolves in the same run.
  ssm_v2_install:
    stack: config0-hub:::aws::ssm_ec2_exec_eventbridge_install
    labels:
      - general
      - infrastructure
    dependencies:
      - lambda_bucket
    arguments:
      s3_bucket: selector:::bucket_vars::s3_bucket
      aws_region: us-west-2
      # LONGBUILD: prove the deadline-driven done-marker watch. slowtest runs the
      # real build then pads with a sleep, so the CodeBuild build genuinely runs
      # past 15 minutes - the case the retired hard 900s watch cap made
      # impossible. The pad is 1200s on top of a ~4min real build, so
      # build_timeout 2100 leaves ~10min of headroom. run.py then sets
      # order_timeout = 2100 + 600 = 2700s, which drives the worker's watch
      # deadline, the target-creds duration and TimeoutInMinutesOverride.
      script_name: docker-to-lambda.slowtest.sh
      build_timeout: 2100
    selectors:
      - bucket_vars

  # Order 4: create an SSM-managed EC2 host for the live task-token proof.
  # Explicit dependencies hold the host until the story VPC and install record
  # are complete. story_vpc already depends on story_key_pair.
  ssm_test_host:
    stack: config0-hub:::aws::aws_ec2_server
    labels:
      - general
      - infrastructure
    dependencies:
      - story_vpc
      - ssm_v2_install
    arguments:
      hostname: item11-ssm-runner
      ssh_key_name: selector:::keypair_vars::key_name
      subnet_ids: selector:::network_vars::public_subnet_ids:csv
      sg_id: selector:::sg_vars::bastion_sg_id
      instance_type: t3.small
      iam_instance_profile: selector:::install_vars::instance_profile_name
      cloud_tags_hash:
        "config0:managed": "true"
        environment: dev
        purpose: ssm-ec2-exec-eventbridge-longbuild
    selectors:
      - keypair_vars
      - network_vars
      - sg_vars
      - install_vars
    spec:
      serialization:
        to_base64:
          arguments:
            - cloud_tags_hash
