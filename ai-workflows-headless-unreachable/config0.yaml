# Phase 4 AI workflows acceptance, step 4, unreachable server: one call to the card server
# agent-clock while its runner daemon is stopped (step 7 stopped it). Nothing answers, so
# the order must end at its expire_at (FIRE + P + the margin), not with a fabricated stop
# confirmation. When step 7 starts the daemon again, this late message is deleted unrun.

global:
  metadata:
    workflow:
      category: ai
  arguments:
    aws_default_region: ap-northeast-1

selectors:
  unreachable:
    match:
      filter:
        resource_type: agent_result
      keys:
        name: bounds-unreachable

stacks:
  link:
    stack: williaumwu:::config0_yamls_repos::ai_submit_check
    selectors:
      - unreachable
    arguments:
      hostname: agent-clock
      subnet_id: subnet-0df609094a0975441   # unused with hostname; the stack requires it
      repository_url: https://github.com/williaumwu/config0-ai-workflows-acceptance
      branch: acceptance
      repository_credential_set_name: ACCEPTANCE_REPO_TOKEN
      artifact_prefix: s3://config0-tmp-62635338/ai-acceptance/unreachable/
      max_turns: 6
      max_budget_usd: 0.5
      phase2complete_timeout: 300
      run_timeout: 3600
      task: >-
        Read src/greeting.py. Do not change any file. Report the name of the
        function it defines and the exact string that function returns for the
        name "Config0".
      task_schema: >-
        {"type": "object", "required": ["function_name", "greeting"],
        "properties": {"function_name": {"type": "string"}, "greeting": {"type": "string"}},
        "additionalProperties": false}
      calls: >-
        [{"call_name": "bounds-unreachable", "adapter": "pi", "model": "openai/gpt-5-mini", "key_set_name": "OPENAI_API_KEY", "result_selector": "unreachable"}]
    spec:
      schedule:
        archive:
          timeout: 3000
