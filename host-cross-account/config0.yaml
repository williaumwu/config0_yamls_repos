# CON-23 live proof: a host order aimed at a connected (second) AWS account.
# Hub (570017720022) holds the tmp bucket the done-marker lives in; every stack
# below creates its resources in the connected account 604227045267 by naming
# the connection gitops-second. Smallest chain that ends in one host order:
# key pair, executor install, VPC with SSM endpoints + NAT, private server,
# host configuration. Modelled on ssm-host-docker/.
#
# Precondition: POST /api/v1/connections with account_name gitops-second.

global:
  arguments:
    aws_default_region: ap-northeast-1

labels:
  general:
    environment: dev
    purpose: host-xacct
  infrastructure:
    cloud: aws
    product: vpc
    area: network

selectors:
  keypair_vars:
    match:
      filter:
        resource_type: ssh_key_pair
      labels:
        environment: dev
        purpose: host-xacct
  network_vars:
    match:
      filter:
        resource_type: vpc
      labels:
        environment: dev
        purpose: host-xacct
        area: network
        region: ap-northeast-1
        cloud: aws
  install_vars:
    match:
      filter:
        resource_type: ssm_ec2_exec_eventbridge_install
      labels:
        environment: dev
        purpose: host-xacct

stacks:
  key_pair:
    stack: config0-hub:::aws::ec2_keypair
    labels:
      - general
      - infrastructure
    arguments:
      key_name: host-xacct
    connections:
      - name: gitops-second

  # Creates the Lambda-artifacts bucket (s3_bucket) in the connected account.
  ssm_executor_install:
    stack: config0-hub:::aws::ssm_ec2_exec_eventbridge_install
    labels:
      - general
      - infrastructure
    arguments:
      s3_bucket: host-xacct-lambda-artifacts-604227045267
      aws_region: ap-northeast-1
      install_name: hostxacct
    connections:
      - name: gitops-second

  vpc:
    stack: config0-hub:::aws_networking::aws_vpc_simple
    labels:
      - general
      - infrastructure
    dependencies:
      - key_pair
    arguments:
      vpc_name: host-xacct-vpc
      enable_ssm_endpoints: true
      enable_nat_gateway: true
      cloud_tags_hash:
        environment: dev
        purpose: host-xacct
    spec:
      serialization:
        to_base64:
          arguments:
            - cloud_tags_hash
    connections:
      - name: gitops-second

  server:
    stack: config0-hub:::aws::aws_ec2_server
    labels:
      - general
      - infrastructure
    dependencies:
      - vpc
      - ssm_executor_install
    arguments:
      hostname: host-xacct-01
      ssh_key_name: selector:::keypair_vars::key_name
      subnet_ids: selector:::network_vars::private_subnet_ids:csv
      associate_public_ip_address: "false"
      instance_type: t3.small
      instance_profile_name: selector:::install_vars::instance_profile_name
      managed_tag_key: selector:::install_vars::managed_tag_key
      managed_tag_value: selector:::install_vars::managed_tag_value
      cloud_tags_hash:
        environment: dev
        purpose: host-xacct
    selectors:
      - keypair_vars
      - network_vars
      - install_vars
    spec:
      serialization:
        to_base64:
          arguments:
            - cloud_tags_hash
    connections:
      - name: gitops-second

  # The host order: Docker over the SSM executor, in the connected account.
  host_config:
    stack: config0-hub:::ubuntu::docker_host_config
    labels:
      - general
      - infrastructure
    dependencies:
      - server
    arguments:
      hostname: host-xacct-01
      install_name: hostxacct
    connections:
      - name: gitops-second
