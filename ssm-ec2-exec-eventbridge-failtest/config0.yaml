global:
  arguments:
    aws_default_region: ap-northeast-1

labels:
  general:
    environment: dev
    purpose: ssm-ec2-exec-eventbridge

stacks:
  # Order 0: create the Lambda-artifacts bucket (the install stack's own first
  # job, from s3_bucket), build the Lambda zips (CodeBuild), then create the
  # infra (terraform).
  ssm_v2_install:
    stack: config0-hub:::aws::ssm_ec2_exec_eventbridge_install
    labels:
      - general
    arguments:
      s3_bucket: ssm-ec2-exec-eventbridge-failtest-570017720022
      aws_region: ap-northeast-1
      # FAILTEST: run the self-test instead of the builder — build succeeds,
      # no zips upload, terraform partially creates then fails on missing
      # lambda code. Deterministic reproduction of the failed-install orphan
      # case, used to prove destroy now reaches partial creates.
      script_name: docker-to-lambda.failtest.sh
