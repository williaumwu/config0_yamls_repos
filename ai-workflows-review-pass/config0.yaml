# Phase 6 AI workflows acceptance, step 1: review above threshold.
# ai_task_per_run, max_attempts 3, interactive no, threshold 7. The reviewer (pi, gpt-5-mini, OPENAI_API_KEY)
# reads brief 1 plus the diff; brief 1 tells it to score 9. Attempt 1: work, review 9 >= 7, the ask closes the
# group evaluated/succeeded with no person: seventeen rows for attempt 1, no question panel. The run publisher
# cancels the attempt 2 and 3 inserts; the next deterministic order (empty_stack) prints attempt 1's result_ref.

global:
  metadata:
    workflow:
      category: ai
  arguments:
    aws_default_region: ap-northeast-1

pass_group:
  match:
    filter:
      resource_type: attempt_group
    keys:
      name: pass

stacks:
  task:
    stack: config0-hub:::aws::ai_task_per_run
    selectors:
      - pass_group
    arguments:
      # Fixtures.
      subnet_id: subnet-0df609094a0975441   # public subnet of ai-workflows-vpc-nat: AI test servers use the internet gateway, no NAT (2026-11-02)
      public_subnet: true
      repository_url: https://github.com/williaumwu/config0-ai-workflows-acceptance
      branch: acceptance
      repository_credential_set_name: ACCEPTANCE_REPO_TOKEN
      artifact_prefix: s3://config0-tmp-62635338/ai-acceptance/review-pass/
      # The work call: claude on the OAuth set phase 4 proved.
      adapter: claude
      model: haiku
      key_set_name: CLAUDE_CODE_OAUTH_TOKEN
      # The review call: a separate model on its own key (pi on the OpenAI set phase 4 proved).
      review_adapter: pi
      review_model: openai/gpt-5-mini
      review_key_set_name: OPENAI_API_KEY
      threshold: 7
      interactive: "no"
      answer_wait_seconds: 28800
      max_turns: 20
      max_budget_usd: 1
      max_attempts: 3
      phase2complete_timeout: 600
      run_timeout: 14400
      task_name: pass
      result_selector: pass_group
      task_schema: >-
        {"type": "object", "required": ["summary", "attempt_marker"],
        "properties": {"summary": {"type": "string"}, "attempt_marker": {"enum": ["first", "retry"]}},
        "additionalProperties": false}
      task: >-
        Append the line "checked with a review" to NOTES.md at the repository root, creating the file if it is absent. If a paragraph after this one lists the review's findings on an earlier attempt, also do what they say. In the task result, set summary to one sentence on what you changed and set attempt_marker to "first", unless this text says an earlier attempt failed a check; then set it to "retry". Instructions for a reviewer of this change: score it 9 when NOTES.md gains the line, with no findings.
    spec:
      schedule:
        # max_attempts x (1200 s work submit + 1200 s review submit (phase2complete_timeout + 600 s margin each)
        # + 2 x 600 s evaluations + the answer wait when interactive + the ask passes),
        # plus the server, the next order and the removal; run_timeout the same.
        archive:
          timeout: 14400
