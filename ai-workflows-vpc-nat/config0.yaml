# Phase 2 AI workflows acceptance: private subnets use a NAT gateway for egress;
# public subnets supply the public-subnet placement option.

global:
  arguments:
    aws_default_region: ap-northeast-1

labels:
  general:
    environment: dev
    purpose: ai-workflows-nat
  infrastructure:
    cloud: aws
    product: vpc
    area: network

stacks:
  vpc:
    stack: config0-hub:::aws_networking::aws_vpc_simple
    labels:
      - general
      - infrastructure
    arguments:
      vpc_name: ai-workflows-vpc-nat
      enable_nat_gateway: true
      cloud_tags_hash:
        environment: dev
        purpose: ai-workflows-nat
    spec:
      serialization:
        to_base64:
          arguments:
            - cloud_tags_hash
