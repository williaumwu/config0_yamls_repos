# AI workflows acceptance network: a VPC whose private subnets reach the internet
# through the auto-scaling NAT instance stack (aws_nat_inst_vpc, t3.nano class),
# never a NAT gateway. Public subnets supply the public-subnet placement option.
# Same composition as the vpc/ scenario: the nat stack reads the vpc resource
# record through the vpc_vars selector, so it runs after the vpc stack writes back.

global:
  arguments:
    aws_default_region: ap-northeast-1

labels:
  general:
    environment: dev
    purpose: ai-workflows-nat
  infrastructure:
    cloud: aws
    product: vpc
    area: network

selectors:
  vpc_vars:
    match:
      filter:
        resource_type: vpc
      labels:
        environment: dev
        purpose: ai-workflows-nat
        area: network
        cloud: aws

stacks:
  vpc:
    stack: config0-hub:::aws_networking::aws_vpc_simple
    labels:
      - general
      - infrastructure
    arguments:
      vpc_name: ai-workflows-vpc-nat
      enable_nat_gateway: false
      cloud_tags_hash:
        environment: dev
        purpose: ai-workflows-nat
    spec:
      serialization:
        to_base64:
          arguments:
            - cloud_tags_hash

  nat:
    stack: config0-hub:::aws_networking::aws_nat_inst_vpc
    labels:
      - general
      - infrastructure
    dependencies:
      - vpc
    arguments:
      service_name: ai-workflows-nat
      vpc_id: selector:::vpc_vars::vpc_id
      public_subnet_ids: selector:::vpc_vars::public_subnet_ids:csv
      private_route_table_id: selector:::vpc_vars::private_route_table_id
      instance_types: t3.nano,t3a.nano
      cidr_ingress_accept: 0.0.0.0/0
    selectors:
      - vpc_vars
