# Phase 5 AI workflows acceptance, step 1: a first-attempt win with max_attempts 3.
#
# agent_attempts_per_run creates the per-run server, then agent_attempts creates
# this run's attempt_groups row for the task "readme" and inserts three
# agent_call attempts, chained. Attempt 1's submit order and evaluation order
# run; its evaluation passes every check (finished, envelope, schema, no
# acceptance_schema, a non-empty diff) and writes the row evaluated, succeeded.
# The run publisher cancels attempts 2 and 3, still queued, and closes the row.
# The next order (empty_stack) resolves selector:::readme_group::result_ref when
# it fires and prints attempt 1's result_ref. Then the server is removed.
#
# Fixtures (plan phase 5, "Fixtures before acceptance"; the human's, from phase
# 4): re-read phase 4's proofs before step 1 and write the subnet, the test
# repository, its read credential set and the artifact prefix below. The
# FIXTURE values fail loud at emission (not https://, not s3://).

global:
  metadata:
    workflow:
      category: ai
  arguments:
    aws_default_region: ap-northeast-1

# The task's attempt_groups row in this run (the scope filter keeps it to the run).
readme_group:
  match:
    filter:
      resource_type: attempt_group
    keys:
      name: readme

stacks:
  attempts:
    stack: config0-hub:::aws::agent_attempts_per_run
    selectors:
      - readme_group
    arguments:
      # Fixtures.
      subnet_id: subnet-0df609094a0975441   # public subnet of ai-workflows-vpc-nat: AI test servers use the internet gateway, no NAT (2026-11-02)
      public_subnet: true
      repository_url: https://github.com/williaumwu/config0-ai-workflows-acceptance
      branch: acceptance
      repository_credential_set_name: ACCEPTANCE_REPO_TOKEN
      artifact_prefix: s3://config0-tmp-62635338/ai-acceptance/attempt-first/
      key_set_name: CLAUDE_CODE_OAUTH_TOKEN   # the set phase 4 proved with the claude adapter
      # The call.
      adapter: claude
      model: haiku
      max_turns: 20
      max_budget_usd: 1
      max_attempts: 3
      phase2complete_timeout: 900
      run_timeout: 7200
      task_schema: >-
        {"type": "object", "required": ["summary", "attempt_marker"],
        "properties": {"summary": {"type": "string"}, "attempt_marker": {"enum": ["first", "retry"]}},
        "additionalProperties": false}
      tasks: >-
        [{"name": "readme", "result_selector": "readme_group",
        "task": "Append the line \"checked by an attempt group\" to NOTES.md at the repository root, creating the file if it is absent. In the task result, set summary to one sentence on what you changed and set attempt_marker to \"first\"."}]
    spec:
      schedule:
        # 3 x (900 s park + 600 s evaluation) + the server and its removal.
        archive:
          timeout: 6600
