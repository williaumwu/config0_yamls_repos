# Phase 2 AI workflows acceptance, step 1: a project with workflow category ai.
# Before the AI workflows add-on is installed, Add Project refuses it with 409 ai_workflows_not_installed.

global:
  metadata:
    workflow:
      category: ai
  arguments:
    aws_default_region: ap-northeast-1

labels:
  general:
    environment: dev
    purpose: ai-workflows-category-ai
  infrastructure:
    cloud: aws
    product: vpc
    area: network

stacks:
  vpc:
    stack: config0-hub:::aws_networking::aws_vpc_simple
    labels:
      - general
      - infrastructure
    arguments:
      vpc_name: ai-workflows-category-ai
      enable_nat_gateway: false
      cloud_tags_hash:
        environment: dev
        purpose: ai-workflows-category-ai
    spec:
      serialization:
        to_base64:
          arguments:
            - cloud_tags_hash
