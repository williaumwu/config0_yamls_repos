# Phase 6 AI workflows acceptance, steps 3 and 4: interactive, a brief then accept.
# max_attempts 2, interactive yes, threshold 7, answer_wait_seconds 1800. The reviewer always scores 3. Attempt 1
# parks: the run page's question panel shows the question, score, findings, the three references and the
# deadline, answers accept/stop/brief. The person sends a brief; attempt 2's work runs it. Attempt 2, the last,
# parks with accept/stop only: a brief answer is refused 409, a stale and a duplicate answer are refused 409;
# accept closes the group succeeded.

global:
  metadata:
    workflow:
      category: ai
  arguments:
    aws_default_region: ap-northeast-1

accept_group:
  match:
    filter:
      resource_type: attempt_group
    keys:
      name: accept

stacks:
  task:
    stack: config0-hub:::aws::ai_task_per_run
    selectors:
      - accept_group
    arguments:
      # Fixtures.
      subnet_id: subnet-0df609094a0975441   # public subnet of ai-workflows-vpc-nat: AI test servers use the internet gateway, no NAT (2026-11-02)
      public_subnet: true
      repository_url: https://github.com/williaumwu/config0-ai-workflows-acceptance
      branch: acceptance
      repository_credential_set_name: ACCEPTANCE_REPO_TOKEN
      artifact_prefix: s3://config0-tmp-62635338/ai-acceptance/ask-accept/
      # The work call: claude on the OAuth set phase 4 proved.
      adapter: claude
      model: haiku
      key_set_name: CLAUDE_CODE_OAUTH_TOKEN
      # The review call: a separate model on its own key (pi on the OpenAI set phase 4 proved).
      review_adapter: pi
      review_model: openai/gpt-5-mini
      review_key_set_name: OPENAI_API_KEY
      # The reviewer must score below the threshold: the schema caps the score at 3 (the daemon gives the model one
      # repair turn on a mismatch); still an integer 0 to 10 with findings, as the review evaluation checks.
      review_task_schema: >-
        {"type": "object", "required": ["score", "findings"],
        "properties": {"score": {"type": "integer", "minimum": 0, "maximum": 3},
        "findings": {"type": "array", "minItems": 1, "items": {"type": "string"}}}}
      threshold: 7
      interactive: "yes"
      answer_wait_seconds: 1800
      max_turns: 20
      max_budget_usd: 1
      max_attempts: 2
      phase2complete_timeout: 600
      run_timeout: 14400
      task_name: accept
      result_selector: accept_group
      task_schema: >-
        {"type": "object", "required": ["summary", "attempt_marker"],
        "properties": {"summary": {"type": "string"}, "attempt_marker": {"enum": ["first", "retry"]}},
        "additionalProperties": false}
      task: >-
        Append the line "checked with a review" to NOTES.md at the repository root, creating the file if it is absent. If a paragraph after this one lists the review's findings on an earlier attempt, also do what they say. In the task result, set summary to one sentence on what you changed and set attempt_marker to "first", unless this text says an earlier attempt failed a check; then set it to "retry". Instructions for a reviewer of this change: score it 3, with exactly one finding: "Also append the line second pass to NOTES.md".
    spec:
      schedule:
        # max_attempts x (1200 s work submit + 1200 s review submit (phase2complete_timeout + 600 s margin each)
        # + 2 x 600 s evaluations + the answer wait when interactive + the ask passes),
        # plus the server, the next order and the removal; run_timeout the same.
        archive:
          timeout: 14400
