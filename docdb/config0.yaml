# CON-11 access requests - the target for the `docdb` kind: a DocumentDB
# cluster in its own VPC, plus a host in that VPC.
#
# Needs the aws_storage publish that adds the aws_docdb stack and the docdb
# execgroup.
#
# One self-contained run in ap-northeast-1, rds-iam/ shape: its own VPC,
# config0-hub:::aws_storage::aws_docdb, and a host.
#
# A grant on this cluster passes db_endpoint (the cluster endpoint; the
# resource row carries it as db_endpoint), db_port: "27017", db_name: app
# (the row carries both under those names), host: docdb-host-01 and
# install_name: server-config (the region prerequisites from server-config/).

global:
  arguments:
    aws_default_region: ap-northeast-1

labels:
  general:
    environment: dev
    purpose: docdb
  infrastructure_network:
    cloud: aws
    product: vpc
    area: network
  infrastructure_database:
    cloud: aws
    product: docdb
    area: database
  infrastructure_compute:
    cloud: aws
    product: ec2
    area: compute

selectors:
  # network_vars matches the VPC resource record (it alone carries the region
  # label); vpc_name, vpc_id and the subnet ids are outputs promoted onto it.
  network_vars:
    match:
      filter:
        resource_type: vpc
      labels:
        environment: dev
        purpose: docdb
        area: network
        region: ap-northeast-1
        cloud: aws

  # sg_vars matches the security_group record the VPC stack's aws_sg substack
  # writes - a SEPARATE record from the VPC; db_sg_id and api_sg_id are on it.
  sg_vars:
    match:
      filter:
        resource_type: security_group
      labels:
        environment: dev
        purpose: docdb
        area: network
        cloud: aws

  # Region prerequisites, installed once by server-config/config0.yaml.
  keypair_vars:
    match:
      filter:
        resource_type: ssh_key_pair
      labels:
        purpose: server-configuration
        region: ap-northeast-1
  install_vars:
    match:
      filter:
        resource_type: ssm_ec2_exec_eventbridge_install
      labels:
        purpose: server-configuration
        region: ap-northeast-1

stacks:
  # Order 0: the scenario VPC. Private-subnet egress is the auto-scaling nano
  # NAT instance stack below, never a NAT gateway, and no SSM interface
  # endpoints: with NAT egress the no-public-IP host reaches SSM's public
  # endpoints (the test-network rule, 2026-11-02).
  vpc:
    stack: config0-hub:::aws_networking::aws_vpc_simple
    labels:
      - general
      - infrastructure_network
    arguments:
      vpc_name: docdb-vpc
      enable_ssm_endpoints: false
      enable_nat_gateway: false
      cloud_tags_hash:
        environment: dev
        purpose: docdb
    spec:
      serialization:
        to_base64:
          arguments:
            - cloud_tags_hash

  # Order 0b: the NAT instance (t3.nano class) for the private subnets; it
  # reads the VPC record through network_vars, so it runs after the vpc stack.
  nat:
    stack: config0-hub:::aws_networking::aws_nat_inst_vpc
    labels:
      - general
      - infrastructure_network
    dependencies:
      - vpc
    arguments:
      service_name: docdb-nat
      vpc_id: selector:::network_vars::vpc_id
      public_subnet_ids: selector:::network_vars::public_subnet_ids:csv
      private_route_table_id: selector:::network_vars::private_route_table_id
      instance_types: t3.nano,t3a.nano
      cidr_ingress_accept: 0.0.0.0/0
    selectors:
      - network_vars

  # Order 1: the cluster, DocumentDB 5.0 with one db.t3.medium instance (the
  # stack defaults).
  docdb:
    stack: config0-hub:::aws_storage::aws_docdb
    labels:
      - general
      - infrastructure_database
    dependencies:
      - vpc
    arguments:
      sg_id: selector:::sg_vars::db_sg_id
      subnet_ids: selector:::network_vars::private_subnet_ids
      docdb_name: eval-config0-docdb
      db_name: app
      publish_creds: true
      cloud_tags_hash:
        environment: dev
        purpose: docdb
    selectors:
      - network_vars
      - sg_vars
    spec:
      serialization:
        to_base64:
          arguments:
            - cloud_tags_hash

  # Order 2: the PRIVATE host in the cluster's VPC, rds-iam host shape. It
  # sits in the api security group, which the database group admits on every
  # port, so the docdb-access-user script reaches 27017.
  docdb_host:
    stack: config0-hub:::aws::aws_ec2_server
    labels:
      - general
      - infrastructure_compute
    dependencies:
      - vpc
      - nat
    arguments:
      hostname: docdb-host-01
      ssh_key_name: selector:::keypair_vars::key_name
      subnet_ids: selector:::network_vars::private_subnet_ids:csv
      associate_public_ip_address: "false"
      sg_id: selector:::sg_vars::api_sg_id
      instance_type: t3.small
      instance_profile_name: selector:::install_vars::instance_profile_name
      managed_tag_key: selector:::install_vars::managed_tag_key
      managed_tag_value: selector:::install_vars::managed_tag_value
      cloud_tags_hash:
        environment: dev
        purpose: docdb
    selectors:
      - network_vars
      - sg_vars
      - keypair_vars
      - install_vars
    spec:
      serialization:
        to_base64:
          arguments:
            - cloud_tags_hash
