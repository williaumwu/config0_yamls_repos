# Story 102 - deploy a VPC through the PLATFORM path.
#
# The developer opts into a platform with the top-level `platform:` key and then
# names a child of that platform's frozen catalogue with `stack_alias:` instead
# of an inline `stack:` FQN. The platform owns aws_default_region and
# cloud_tags_hash for this child, plus its labels, selectors and inputvars - they
# come from the catalogue, not from here. Setting a platform-owned key in this
# file (in `arguments:` or in a `global: arguments:` block) is an error.
#
# The only argument below is the business one: the VPC's name.

platform: config0-hub:::devops-solutions::platform-eval-config0

labels:
  general:
    environment: dev
    purpose: eval-config0

stacks:
  vpc:
    stack_alias: aws_vpc_simple
    arguments:
      vpc_name: eval-config0-platform-vpc

  # NAT via the platform catalogue (aws_nat_inst_vpc child), mirroring the
  # original platform config (flask_sample 3edc2f5) and story 2's vpc+nat pair.
  # Without it the private subnets have no route out and EKS worker nodes
  # (story 104) cannot join the cluster. The platform owns aws_default_region +
  # cloud_tags_hash and injects the network_vars selector; the selector
  # expressions below resolve off the vars_set record, exactly as 3edc2f5 did.
  nat:
    stack_alias: aws_nat_inst_vpc
    dependencies:
      - vpc
    arguments:
      service_name: eval-config0-platform-nat
      instance_types: t3.nano,t3a.nano
      use_spot_instance: true
      vpc_id: selector:::network_vars::vpc_id
      public_subnet_ids: selector:::network_vars::public_subnet_ids:csv
      private_route_table_id: selector:::network_vars::private_route_table_id
