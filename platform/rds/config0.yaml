# Story 103 - deploy an RDS through the PLATFORM path (story 3 via platform definition).
#
# The platform owns aws_default_region and cloud_tags_hash for this child, plus the
# `general` + `aws_cloud` label groups, the `network_vars` selector definition and the
# `infracost` inputvars set. None of those may appear here - a platform-owned key in
# this file fails project creation (D5/D8).
#
# What is left is the business wiring: the RDS's own name/db, and the two required
# ids read off the vars_set record via the platform's injected `network_vars` selector.
# That vars_set is produced by `network-vars-set/config0.yaml` and must exist in this
# tenant, under the same environment=dev / purpose=eval-config0 labels, before this runs -
# and that vars_set must be created with evaluate: true, or the ids below resolve to raw
# selector strings this schedule has no definition for.
#
# No labels: block here (unlike platform/vpc) - the platform's label groups replace any
# group of the same name (D6), so writing them is redundant.

platform: config0-hub:::devops-solutions::platform-eval-config0

stacks:
  rds:
    stack_alias: aws_rds
    arguments:
      rds_name: eval-config0-platform-rds
      db_name: app
      publish_creds: true
      sg_id: selector:::network_vars::db_sg_id
      subnet_ids: selector:::network_vars::private_subnet_ids
