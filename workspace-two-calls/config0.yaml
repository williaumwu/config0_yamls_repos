selectors:
  host_vars:
    match:
      filter:
        resource_type: server
      keys:
        name: ssm-host-docker-01

stacks:
  workspace_relay:
    stack: config0-hub:::ansible::workspace_relay_test
    arguments:
      hostname: selector:::host_vars::hostname
      mode: two_calls
    selectors:
      - host_vars
