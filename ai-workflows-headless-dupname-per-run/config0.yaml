# User story 15 part 4C (CON-131 phase 4, check 8): a duplicate call name in one run, on a
# per-run server. Three submit calls in one run, one after another, to the server this run
# creates; the third reuses the first call's name. The third call's finalize pass must
# fail loud and leave the first call's agent_result row unchanged. The failed call fails
# the job, so the removal does not run and the server stays for the user (Remove Project
# removes it). ai-workflows-headless-dupname is the same check on a card server.
#
# The server sits on the public subnet with the internet gateway (public_subnet), the
# test-network rule; no NAT gateway, no SSM interface endpoints. Other tracks render this
# file with their own public subnet and hub tmp bucket (user story 15, helpers/ai.sh).

global:
  metadata:
    workflow:
      category: ai
  arguments:
    aws_default_region: ap-northeast-1

selectors:
  dup_a:
    match:
      filter:
        resource_type: agent_result
      keys:
        name: dup-a
      scope: run_id
  dup_b:
    match:
      filter:
        resource_type: agent_result
      keys:
        name: dup-b
      scope: run_id

stacks:
  dup:
    stack: williaumwu:::config0_yamls_repos::ai_submit_check
    selectors:
      - dup_a
      - dup_b
    arguments:
      subnet_id: subnet-0df609094a0975441   # public subnet of ai-workflows-vpc-nat
      public_subnet: true
      repository_url: https://github.com/williaumwu/config0-ai-workflows-acceptance
      branch: acceptance
      repository_credential_set_name: ACCEPTANCE_REPO_TOKEN
      artifact_prefix: s3://config0-tmp-62635338/ai-acceptance/rows/
      max_turns: 6
      max_budget_usd: 0.5
      phase2complete_timeout: 1800
      run_timeout: 7200
      task: >-
        Read src/greeting.py. Do not change any file. Report the name of the
        function it defines and the exact string that function returns for the
        name "Config0".
      task_schema: >-
        {"type": "object", "required": ["function_name", "greeting"],
        "properties": {"function_name": {"type": "string"}, "greeting": {"type": "string"}},
        "additionalProperties": false}
      calls: >-
        [{"call_name": "dup-a", "adapter": "pi", "model": "openai/gpt-5-mini", "key_set_name": "OPENAI_API_KEY", "result_selector": "dup_a"},
        {"call_name": "dup-b", "adapter": "pi", "model": "openai/gpt-5-mini", "key_set_name": "OPENAI_API_KEY", "result_selector": "dup_b"},
        {"call_name": "dup-a", "adapter": "pi", "model": "openai/gpt-5-mini", "key_set_name": "OPENAI_API_KEY", "result_selector": "dup_a"}]
    spec:
      schedule:
        # the server, three parked calls one after another, two reads, the removal.
        archive:
          timeout: 6000
