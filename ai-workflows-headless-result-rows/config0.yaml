# Phase 4 AI workflows acceptance, steps 1 (the result read in the next order) and 8
# (result row identity).
#
# The test stack williaumwu:::config0_yamls_repos::ai_submit_check creates one per-run
# server, submits two calls with different call names to it (both pi; the claude key fixture
# was the OpenAI key), then one
# empty_stack order per call reads that call's agent_result row through a selector
# (resource_type agent_result, keys.name the call name, must_be_one, scoped to this
# run), then removes the server. Rerun the stack for the second run: two more rows,
# each order still reads only its own run's row. Phase 4's agent_submit_per_run
# inserts no in-run reader, and a dependent config0.yaml stack runs in a new run, so
# the reader has to be in the same stack.
#
# The server sits on the public subnet with the internet gateway (agent_server's
# public_subnet), the test-network rule; no NAT gateway, no SSM interface endpoints.

global:
  metadata:
    workflow:
      category: ai
  arguments:
    aws_default_region: ap-northeast-1

selectors:
  pi_row_a:
    match:
      filter:
        resource_type: agent_result
      keys:
        name: pi-rows-a
  pi_row_b:
    match:
      filter:
        resource_type: agent_result
      keys:
        name: pi-rows-b

stacks:
  rows:
    stack: williaumwu:::config0_yamls_repos::ai_submit_check
    selectors:
      - pi_row_a
      - pi_row_b
    arguments:
      subnet_id: subnet-0df609094a0975441   # public subnet of ai-workflows-vpc-nat
      public_subnet: true
      repository_url: https://github.com/williaumwu/config0-ai-workflows-acceptance
      branch: acceptance
      repository_credential_set_name: ACCEPTANCE_REPO_TOKEN
      artifact_prefix: s3://config0-tmp-62635338/ai-acceptance/rows/
      max_turns: 6
      max_budget_usd: 0.5
      phase2complete_timeout: 1800
      run_timeout: 7200
      task: >-
        Read src/greeting.py. Do not change any file. Report the name of the
        function it defines and the exact string that function returns for the
        name "Config0".
      task_schema: >-
        {"type": "object", "required": ["function_name", "greeting"],
        "properties": {"function_name": {"type": "string"}, "greeting": {"type": "string"}},
        "additionalProperties": false}
      calls: >-
        [{"call_name": "pi-rows-a", "adapter": "pi", "model": "openai/gpt-5-mini",
        "key_set_name": "OPENAI_API_KEY", "result_selector": "pi_row_a"},
        {"call_name": "pi-rows-b", "adapter": "pi", "model": "openai/gpt-5-mini",
        "key_set_name": "OPENAI_API_KEY", "result_selector": "pi_row_b"}]
    spec:
      schedule:
        # the server, two parked calls (one slot each in turn), two reads, the removal.
        archive:
          timeout: 6000
