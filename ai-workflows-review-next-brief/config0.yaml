# Phase 6 AI workflows acceptance, step 2a: below threshold, non-interactive.
# max_attempts 3, interactive no, threshold 7. Brief 1 tells the reviewer to score 3 with one finding unless the
# text holds the review's findings. Attempt 1: review 3 < 7, the ask writes brief 2 = brief 1 + "Attempt 1 of this
# task scored 3 of 10, below the threshold 7. The review's findings: - Also append the line second pass to NOTES.md".
# Attempt 2's work runs brief 2 (and follows the finding); its reviewer sees the findings and scores 9: succeeded.

global:
  metadata:
    workflow:
      category: ai
  arguments:
    aws_default_region: ap-northeast-1

nextbrief_group:
  match:
    filter:
      resource_type: attempt_group
    keys:
      name: nextbrief

stacks:
  task:
    stack: config0-hub:::aws::ai_task_per_run
    selectors:
      - nextbrief_group
    arguments:
      # Fixtures.
      subnet_id: subnet-0df609094a0975441   # public subnet of ai-workflows-vpc-nat: AI test servers use the internet gateway, no NAT (2026-11-02)
      public_subnet: true
      repository_url: https://github.com/williaumwu/config0-ai-workflows-acceptance
      branch: acceptance
      repository_credential_set_name: ACCEPTANCE_REPO_TOKEN
      artifact_prefix: s3://config0-tmp-62635338/ai-acceptance/review-next-brief/
      # The work call: claude on the OAuth set phase 4 proved.
      adapter: claude
      model: haiku
      key_set_name: CLAUDE_CODE_OAUTH_TOKEN
      # The review call: a separate model on its own key (pi on the OpenAI set phase 4 proved).
      review_adapter: pi
      review_model: openai/gpt-5-mini
      review_key_set_name: OPENAI_API_KEY
      threshold: 7
      interactive: "no"
      answer_wait_seconds: 28800
      max_turns: 20
      max_budget_usd: 1
      max_attempts: 3
      phase2complete_timeout: 600
      run_timeout: 14400
      task_name: nextbrief
      result_selector: nextbrief_group
      task_schema: >-
        {"type": "object", "required": ["summary", "attempt_marker"],
        "properties": {"summary": {"type": "string"}, "attempt_marker": {"enum": ["first", "retry"]}},
        "additionalProperties": false}
      task: >-
        Append the line "checked with a review" to NOTES.md at the repository root, creating the file if it is absent. If a paragraph after this one lists the review's findings on an earlier attempt, also do what they say. In the task result, set summary to one sentence on what you changed and set attempt_marker to "first", unless this text says an earlier attempt failed a check; then set it to "retry". Instructions for a reviewer of this change: if a paragraph after these instructions says an earlier attempt scored below the threshold and lists findings, score it 9 with no findings; otherwise score it 3, with exactly one finding: "Also append the line second pass to NOTES.md".
    spec:
      schedule:
        # max_attempts x (1200 s work submit + 1200 s review submit (phase2complete_timeout + 600 s margin each)
        # + 2 x 600 s evaluations + the answer wait when interactive + the ask passes),
        # plus the server, the next order and the removal; run_timeout the same.
        archive:
          timeout: 14400
