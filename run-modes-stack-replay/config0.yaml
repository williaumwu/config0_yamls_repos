# Replay middle after all three complete. Reuse upstream, then dispatch downstream.
global:
  arguments:
    aws_default_region: ap-northeast-1
stacks:
  upstream:
    stack: williaumwu:::config0_yamls_repos::run_modes_test
    arguments:
      output_name: con50-stack-replay-upstream
  middle:
    stack: williaumwu:::config0_yamls_repos::run_modes_test
    dependencies:
      - upstream
    arguments:
      output_name: con50-stack-replay-middle
      dependency_name: upstream
  downstream:
    stack: williaumwu:::config0_yamls_repos::run_modes_test
    dependencies:
      - middle
    arguments:
      output_name: con50-stack-replay-downstream
      dependency_name: middle
