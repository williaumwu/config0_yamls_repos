# Phase 4 AI workflows acceptance, step 1: one real headless call per adapter on a
# per-run server (agent_submit_per_run), then the chain removes the server.
#
# claude runs first; pi depends on it, so the completion-triggered dispatch starts
# pi in its own run (its own server ai-<run id>). Each stack runs on its own
# frozen run_timeout (7200 and 6600, step 5 reads both).
#
# Placement (attempt 2): agent_submit_per_run takes public_subnet since found-issues
# batch 2, so the per-run servers sit on the public subnet with the internet gateway
# (the test-network rule; no NAT gateway, no SSM interface endpoints).
#
# Fixtures: the test repository williaumwu/config0-ai-workflows-acceptance (private,
# branch acceptance) and its read credential set ACCEPTANCE_REPO_TOKEN; the key
# sets CLAUDE_CODE_OAUTH_TOKEN and OPENAI_API_KEY; the artifact prefix in the
# tenant's existing tmp bucket (no customer bucket exists in 570017720022).

global:
  metadata:
    workflow:
      category: ai
  arguments:
    aws_default_region: ap-northeast-1
    subnet_id: subnet-0df609094a0975441   # public subnet of ai-workflows-vpc-nat
    public_subnet: true
    repository_url: https://github.com/williaumwu/config0-ai-workflows-acceptance
    branch: acceptance
    repository_credential_set_name: ACCEPTANCE_REPO_TOKEN
    artifact_prefix: s3://config0-tmp-62635338/ai-acceptance/per-run/
    max_turns: 6
    max_budget_usd: 0.5
    phase2complete_timeout: 1800
    task: >-
      Read src/greeting.py. Do not change any file. Report the name of the
      function it defines and the exact string that function returns for the
      name "Config0".
    task_schema: >-
      {"type": "object", "required": ["function_name", "greeting"],
      "properties": {"function_name": {"type": "string"}, "greeting": {"type": "string"}},
      "additionalProperties": false}

stacks:
  claude:
    stack: config0-hub:::aws::agent_submit_per_run
    arguments:
      call_name: claude-greeting
      adapter: claude
      model: haiku
      key_set_name: CLAUDE_CODE_OAUTH_TOKEN
      run_timeout: 7200
    spec:
      schedule:
        # the server (about 8 min), the park (1800 s) and the removal.
        archive:
          timeout: 4800

  pi:
    stack: config0-hub:::aws::agent_submit_per_run
    dependencies:
      - claude
    arguments:
      call_name: pi-greeting
      adapter: pi
      model: openai/gpt-5-mini
      key_set_name: OPENAI_API_KEY
      run_timeout: 6600
    spec:
      schedule:
        archive:
          timeout: 4800
