# Phase 5 AI workflows acceptance, step 2: a second-attempt win with max_attempts 3.
#
# The deterministic check that fails on attempt 1 and passes on attempt 2 is
# the evaluation order's acceptance check, the task's acceptance_schema:
#   {"type": "object", "required": ["attempt_marker"],
#    "properties": {"attempt_marker": {"const": "retry"}}}
# Brief 1 tells the agent to set attempt_marker to "first" unless the brief
# says an earlier attempt failed a check. Attempt 1's result carries "first",
# so its evaluation fails the acceptance check with jsonschema's fixed message
# 'retry' was expected, and writes attempt 2 with brief 2 (372 bytes, inline on
# the row). Attempt 2's submit order omits a task, so its fire pass runs brief
# 2; its result carries "retry" and passes. Attempt 3 is cancelled. No
# completed order runs again.
#
# Brief 1 (the task below):
#   Append the line "checked by an attempt group" to NOTES.md at the repository
#   root, creating the file if it is absent. In the task result, set summary to
#   one sentence on what you changed. Set attempt_marker to "first", unless this
#   brief says an earlier attempt failed a check; then set it to "retry".
#
# Brief 2 (brief 1, a blank line, then the evaluation order's line):
#   <brief 1>
#
#   Attempt 1 of this task failed the acceptance check: 'retry' was expected
#
# Fixtures: as ai-workflows-attempt-first (re-read phase 4's proofs before
# step 1; the FIXTURE values fail loud at emission).

global:
  metadata:
    workflow:
      category: ai
  arguments:
    aws_default_region: ap-northeast-1

notes_group:
  match:
    filter:
      resource_type: attempt_group
    keys:
      name: notes

stacks:
  attempts:
    stack: config0-hub:::aws::agent_attempts_per_run
    selectors:
      - notes_group
    arguments:
      # Fixtures.
      subnet_id: subnet-09fa9ac5614217172   # phase 2's NAT-backed private subnet (ai-workflows-vpc-nat)
      repository_url: FIXTURE-test-repository-https-url
      repository_credential_set_name: FIXTURE-test-repository-read-credential-set
      artifact_prefix: FIXTURE-artifact-prefix-s3-url
      key_set_name: ANTHROPIC_API_KEY       # or CLAUDE_CODE_OAUTH_TOKEN, the set phase 4 holds
      # The call.
      adapter: claude
      max_turns: 20
      max_budget_usd: 1
      max_attempts: 3
      phase2complete_timeout: 900
      run_timeout: 7200
      task_schema: >-
        {"type": "object", "required": ["summary", "attempt_marker"],
        "properties": {"summary": {"type": "string"}, "attempt_marker": {"enum": ["first", "retry"]}},
        "additionalProperties": false}
      tasks: >-
        [{"name": "notes", "result_selector": "notes_group",
        "acceptance_schema": {"type": "object", "required": ["attempt_marker"], "properties": {"attempt_marker": {"const": "retry"}}},
        "task": "Append the line \"checked by an attempt group\" to NOTES.md at the repository root, creating the file if it is absent. In the task result, set summary to one sentence on what you changed. Set attempt_marker to \"first\", unless this brief says an earlier attempt failed a check; then set it to \"retry\"."}]
    spec:
      schedule:
        # 3 x (900 s park + 600 s evaluation) + the server and its removal.
        archive:
          timeout: 6600
