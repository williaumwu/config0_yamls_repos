# CON-11 access requests - the target for the `ec2_windows` kind (`rdp`
# through Fleet Manager: the host is SSM-managed, and ec2:GetPasswordData
# returns the Administrator password).
#
# aws_ec2_server's ec2_server execgroup is a plain aws_instance (no
# provisioner, no cloud-init dependency; user_data defaults to null), so it
# brings up Windows unchanged: ami_filter/ami_owner pick the AMI. Windows
# Server 2022 AMIs ship the SSM agent.
#
# Caveats:
# - disksize 30: the Windows Server 2022 Full Base root snapshot is 30 GiB;
#   the stack default of 20 fails the launch.
# - The key pair is NOT ignored on Windows: GetPasswordData returns the
#   password encrypted with it, so the server-config key pair's private key
#   is what decrypts it.
#
# Reuses, like mongodb-one/: the ssm-host-docker VPC (private subnets, SSM
# interface endpoints, NAT; run ssm-host-docker/ first) and the region
# prerequisites from server-config/ (key pair + SSM executor install,
# install_name server-config). No public IP, no inbound rule: the host keeps
# the VPC default security group, like the ssm-host-docker host.

global:
  arguments:
    aws_default_region: ap-northeast-1

labels:
  general:
    environment: dev
    purpose: ec2-windows
  infrastructure:
    cloud: aws
    product: ec2
    area: compute

selectors:
  network_vars:
    match:
      filter:
        resource_type: vpc
      labels:
        environment: dev
        purpose: ssm-host-docker
        area: network
        region: ap-northeast-1
        cloud: aws
  # Region prerequisites, installed once by server-config/config0.yaml.
  keypair_vars:
    match:
      filter:
        resource_type: ssh_key_pair
      labels:
        purpose: server-configuration
        region: ap-northeast-1
  install_vars:
    match:
      filter:
        resource_type: ssm_ec2_exec_eventbridge_install
      labels:
        purpose: server-configuration
        region: ap-northeast-1

stacks:
  # The PRIVATE Windows server. The executor's instance profile and managed
  # tag make it SSM-managed, which Fleet Manager RDP needs.
  ec2_windows_host:
    stack: config0-hub:::aws::aws_ec2_server
    labels:
      - general
      - infrastructure
    arguments:
      hostname: ec2-windows-01
      ami_filter: Windows_Server-2022-English-Full-Base-*
      ami_owner: amazon
      instance_type: t3.medium
      disksize: 30
      ssh_key_name: selector:::keypair_vars::key_name
      subnet_ids: selector:::network_vars::private_subnet_ids:csv
      associate_public_ip_address: "false"
      instance_profile_name: selector:::install_vars::instance_profile_name
      managed_tag_key: selector:::install_vars::managed_tag_key
      managed_tag_value: selector:::install_vars::managed_tag_value
      cloud_tags_hash:
        environment: dev
        purpose: ec2-windows
    selectors:
      - network_vars
      - keypair_vars
      - install_vars
    spec:
      serialization:
        to_base64:
          arguments:
            - cloud_tags_hash
