# Story 12 A4 fixture: two plain-terraform stacks in one single-account project
# pinned to the SECOND connected account. BOTH stacks carry
# `connections: [{name: gitops-second}]` so the whole project runs as one
# run in account 604227045267. The run, not the project, determines the AWS
# account (see run-lifecycle-contract). Launch after A3 extends the connection
# to openci-tf.
global:
  arguments:
    aws_default_region: ap-northeast-1

labels:
  general:
    environment: dev
    purpose: gitops-e2e
  infrastructure:
    cloud: aws
    area: network

stacks:
  # Stack A: second account via connections. aws_vpc_simple is two terraform
  # execgroups (vpc_simple + the sg_3tier substack), both via tf_executor.
  vpc:
    stack: config0-hub:::aws_networking::aws_vpc_simple
    labels:
      - general
      - infrastructure
    arguments:
      vpc_name: gitops-second-vpc
      cloud_tags_hash:
        environment: dev
        purpose: gitops-e2e
    spec:
      serialization:
        to_base64:
          arguments:
            - cloud_tags_hash
    connections:
      - name: gitops-second

  # Stack B: one terraform execgroup (aws_storage::buckets). Ordered after
  # `vpc` by the standard v2 `dependencies:` key (no data flows from the VPC
  # to a bucket, so this is ordering only). Same second-account connection.
  bucket:
    stack: config0-hub:::aws_storage::aws_s3_bucket
    labels:
      - general
      - infrastructure
    dependencies:
      - vpc
    arguments:
      bucket: gitops-second-e2e
      force_destroy: true
    connections:
      - name: gitops-second
