# The second stack must read the first stack's recorded output under its own run_id.
global:
  arguments:
    aws_default_region: ap-northeast-1
stacks:
  first:
    stack: williaumwu:::config0_yamls_repos::run_modes_test
    arguments:
      output_name: con50-schedule-chain-first
  second:
    stack: williaumwu:::config0_yamls_repos::run_modes_test
    dependencies:
      - first
    arguments:
      output_name: con50-schedule-chain-second
      dependency_name: first
